name: Release Build

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Ensure only one release build runs at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Pin libwebkit2gtk to avoid EGL_BAD_PARAMETER issues on newer systems
          # See: https://github.com/gitbutlerapp/gitbutler/issues/5282
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev=2.44.1-1ubuntu2 \
            libwebkit2gtk-4.1-dev=2.44.1-1ubuntu2 \
            libjavascriptcoregtk-4.0-18=2.44.1-1ubuntu2 \
            libjavascriptcoregtk-4.1-0=2.44.1-1ubuntu2 \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
          # Hold the packages to prevent auto-updates during build
          sudo apt-mark hold libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.0-18 libjavascriptcoregtk-4.1-0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Better IPTV ${{ github.ref_name }}'
          releaseBody: |
            ## What's Changed
            See the assets below to download Better IPTV for your platform.

            **Note:** Make sure MPV is installed on your system before running Better IPTV.

            ### Installation:
            - **Linux**: Download `.AppImage`, make executable, and run
            - **Windows**: Download `.msi` and install
            - **macOS**: Download `.dmg` and drag to Applications
          releaseDraft: true
          prerelease: false
          args: --verbose
