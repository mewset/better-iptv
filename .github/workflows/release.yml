name: Release Build

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Ensure only one release build runs at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu LTS: the binary and every
        # library bundled in the AppImage need the glibc of the build host, so a
        # 24.04 build (glibc 2.39) refuses to start on Debian 12 or Ubuntu 22.04.
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Bundle MPV (Windows only)
        if: matrix.platform == 'windows-latest'
        uses: ./.github/actions/bundle-mpv-windows

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Better IPTV ${{ github.ref_name }}'
          releaseBody: |
            ## What's Changed
            See the assets below to download Better IPTV for your platform.

            **Note:** On Linux and macOS, install MPV from your package manager before running Better IPTV. The Windows installers bundle it.

            ### Installation:
            - **Linux (Arch/Manjaro/Fedora)**: Download `*-arch.AppImage`, make executable, and run (needs `webkit2gtk-4.1`, `gtk3` and `mpv` from your distro)
            - **Linux (Ubuntu/Debian)**: Download regular `.AppImage`, make executable, and run
            - **Windows**: Download `.msi` and install — MPV is included, nothing else to install
            - **macOS**: Download `.dmg` and drag to Applications — needs `brew install mpv`
          releaseDraft: true
          prerelease: false
          args: --verbose

      - name: Create Arch-compatible AppImage (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "📦 Creating Arch-compatible AppImage..."

          # Find the built AppImage (never a -arch one left from a previous run)
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" ! -name "*-arch.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "❌ No AppImage found"
            exit 1
          fi
          echo "Found AppImage: $APPIMAGE"

          # Extract AppImage
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null

          # Download appimagetool. The maintained one, not the archived AppImageKit
          # build: that one swaps Tauri's static runtime for the old libfuse2 one
          # and packs with gzip instead of zstd (84 MB -> 93 MB).
          #
          # Both the tool and the runtime it embeds are pinned to a release and
          # checked against a sha256, so a release is built by exactly the same
          # bits until these lines change. The tool otherwise fetches the runtime
          # from a rolling "continuous" tag at pack time. Verified 2026-10-08:
          # appimagetool 1.9.1 and the continuous build pack a byte-identical
          # AppImage; between runtime 20251108 and continuous lies one change,
          # a 0700 extraction directory for APPIMAGE_EXTRACT_AND_RUN.
          echo "📥 Downloading appimagetool..."
          curl -fL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fL -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum --check --strict <<'SUMS'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64
          SUMS
          chmod +x appimagetool
          # Unpack instead of mounting, so the runner needs no FUSE for it
          export APPIMAGE_EXTRACT_AND_RUN=1

          # linuxdeploy writes AppRun.wrapped as 0770. It still starts when the
          # user owns the mounted squashfs, which is the normal case, but not when
          # it runs as anyone else: the AppImageHub test mounts it as root and
          # launches it as another user in firejail, and gets "Permission denied".
          # Give everyone read access, and execute wherever the owner has it, then
          # repack the regular AppImage in place before the -arch build below.
          echo "🔧 Fixing file permissions in the regular AppImage..."
          chmod -R a+rX squashfs-root
          ARCH=x86_64 ./appimagetool --runtime-file runtime-x86_64 squashfs-root "$APPIMAGE"

          # Drop the bundled Ubuntu library stack entirely and run against the
          # system one, the same way the AUR package does. That is what makes this
          # build usable on distros with a current webkit2gtk, where the bundled
          # WebKit paints a blank window or dies with "Could not create default
          # EGL display".
          #
          # Deleting only part of the bundle does NOT work. linuxdeploy rewrites the
          # helper-process path inside libwebkit2gtk-4.1.so.0 to the relative
          # "././/lib/x86_64-linux-gnu/webkit2gtk-4.1/", resolved against the AppDir,
          # and this WebKit build has no WEBKIT_EXEC_PATH to redirect it. Removing
          # that helper directory while keeping the library is why every -arch build
          # from v2.6.0 through v2.7.0 died at startup with
          #   Failed to spawn child process ".../WebKitNetworkProcess"
          # (Issue #60).
          echo "🔧 Removing the bundled library stack so system WebKit/GTK is used..."
          rm -rf squashfs-root/usr/lib
          rm -rf squashfs-root/apprun-hooks
          rm -f squashfs-root/AppRun.wrapped

          # linuxdeploy's AppRun and its GTK hook only exist to point at the bundle
          # that was just removed, so replace them with a plain launcher.
          cat > squashfs-root/AppRun <<'APPRUN'
          #!/bin/sh
          # Better IPTV - build for distros shipping a current WebKitGTK (Arch, Fedora, ...).
          # Uses the system WebKit/GTK stack; nothing is bundled.
          HERE="$(dirname "$(readlink -f "$0")")"

          have_webkit() {
              for dir in /usr/lib /usr/lib64 /usr/lib/x86_64-linux-gnu /lib/x86_64-linux-gnu; do
                  [ -e "$dir/libwebkit2gtk-4.1.so.0" ] && return 0
              done
              { /sbin/ldconfig -p 2>/dev/null || ldconfig -p 2>/dev/null; } \
                  | grep -q 'libwebkit2gtk-4.1\.so\.0' && return 0
              return 1
          }

          if ! have_webkit; then
              echo "Better IPTV: this build needs your system's WebKitGTK runtime." >&2
              echo "  Arch/Manjaro:  sudo pacman -S webkit2gtk-4.1 gtk3 mpv" >&2
              echo "  Fedora:        sudo dnf install webkit2gtk4.1 gtk3 mpv" >&2
              echo "Or use the regular Better.IPTV_*_amd64.AppImage instead." >&2
              exit 1
          fi

          exec "$HERE/usr/bin/better-ip-tv" "$@"
          APPRUN
          chmod +x squashfs-root/AppRun

          # Guard against the regression that shipped in v2.6.0-v2.7.0: a bundled
          # WebKit without its helper processes. This build must ship no WebKit.
          if [ -e squashfs-root/usr/lib/libwebkit2gtk-4.1.so.0 ] || [ -d squashfs-root/usr/lib ]; then
            echo "❌ Bundled libraries still present - this build must use system libs only"
            exit 1
          fi
          if [ ! -x squashfs-root/usr/bin/better-ip-tv ]; then
            echo "❌ Application binary missing from the AppDir"
            exit 1
          fi

          # Repack as Arch-compatible AppImage
          ARCH_APPIMAGE="${APPIMAGE%.AppImage}-arch.AppImage"
          echo "📦 Repacking as: $ARCH_APPIMAGE"
          ARCH=x86_64 ./appimagetool --runtime-file runtime-x86_64 squashfs-root "$ARCH_APPIMAGE"

          # Cleanup
          rm -rf squashfs-root appimagetool runtime-x86_64

          echo "✅ Arch-compatible AppImage created: $ARCH_APPIMAGE"
          ls -la "$ARCH_APPIMAGE"

      - name: Upload AppImages to release (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Replace the regular AppImage tauri-action uploaded with the repacked one
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" ! -name "*-arch.AppImage" | head -1)
          if [ -n "$APPIMAGE" ]; then
            echo "📤 Replacing regular AppImage in release..."
            gh release upload "${{ github.ref_name }}" "$APPIMAGE" --clobber
            echo "✅ Uploaded: $APPIMAGE"
          fi

          # Find the Arch AppImage
          ARCH_APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*-arch.AppImage" | head -1)
          if [ -n "$ARCH_APPIMAGE" ]; then
            echo "📤 Uploading Arch AppImage to release..."
            gh release upload "${{ github.ref_name }}" "$ARCH_APPIMAGE" --clobber
            echo "✅ Uploaded: $ARCH_APPIMAGE"
          fi
